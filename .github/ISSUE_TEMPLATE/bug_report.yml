name: 🐛 Bug Report
description: Report unexpected behavior or errors in the bot
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you do NOT include any Personal Access Tokens or sensitive credentials in this report.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `python achievement_bot.py ...`
        2. Choose option ...
        3. Encounter error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Error Logs
      description: Please copy and paste relevant logs. Remember to redact any tokens!
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux / Ubuntu
        - macOS
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: e.g. Python 3.11.4
    validations:
      required: true
