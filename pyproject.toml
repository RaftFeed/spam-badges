[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-achievement-bot"
version = "2.0.0"
authors = [
  { name="Rafid Harsyah", email="rafidharsyahh@gmail.com" },
]
description = "Automate and unlock available GitHub profile achievement badges safely and easily"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
achievement-bot = "achievement_bot:main"

[project.urls]
"Homepage" = "https://github.com/RaftFeed/spam-badges"
"Bug Tracker" = "https://github.com/RaftFeed/spam-badges/issues"
